name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --extra dev --extra remote
      - run: uv run --locked --extra dev --extra remote ruff check .
      - run: uv run --no-project --with mcp==2.3.0 python -c "import mcp"
      - run: uv run --locked --extra dev --extra remote pytest
      - run: uv build
      - run: node --test sites/tests/worker.test.mjs
      - run: node sites/scripts/build.mjs
      - run: node sites/scripts/validate-artifact.mjs
